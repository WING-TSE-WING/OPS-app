<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPS Apps</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI", Arial, sans-serif;
    background:#f3f6fb;
    min-height:100vh;
}

.header{
    text-align:center;
    padding:40px 20px;
}

.header h1{
    font-size:42px;
    color:#2563eb;
    font-weight:700;
}

.header p{
    margin-top:10px;
    color:#666;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;

    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(200px,1fr));

    gap:25px;
}

.card{
    background:white;
    border-radius:20px;

    min-height:180px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-decoration:none;
    color:#333;

    transition:all .25s ease;

    box-shadow:
        0 4px 12px rgba(0,0,0,.08);
}

.card:hover{
    background:#2563eb;
    color:white;

    transform:
        translateY(-6px);

    box-shadow:
        0 12px 25px rgba(37,99,235,.25);
}

.icon{
    font-size:60px;
    margin-bottom:15px;
    transition:.25s;
}

.card:hover .icon{
    transform:scale(1.15);
}

.card-title{
    font-size:18px;
    font-weight:600;
    text-align:center;
    padding:0 10px;
}

footer{
    text-align:center;
    padding:30px;
    color:#888;
}

</style>
</head>

<body>

<div class="header">
    <h1>🚀 OPS Apps</h1>
    <p>Operations Internal Tools</p>
</div>

<div class="container">

    ./Volume_Tools/
        <div class="icon">📊</div>
        <div class="card-title">Volume Tools</div>
    </a>

    <a class="card" /
        <div class="icon">🧮</div>
        <div class="card-title">Ezycargo Tools</div>
    </a>

    <a class="card" href="./Undertaking_ class="icon">📦</div>
        <div class="card-title">Undertaking Tools</div>
    </a>

    ./PDF_Tools/
        <div class="icon">📄</div>
        <div class="card-title">PDF Tools</div>
    </a>

    <a class="card" href="./Excel_Batch_    <div class="icon">📁</div>
        <div class="card-title">Excel Compression</div>
    </a>

    ./Order_Assignment_Tool/
        <div class="icon">🤖</div>
        <div class="card-title">Order Assignment</div>
    </a>

</div>

<footer>
    OPS Internal Portal
</footer>

</body>
</html>
`
