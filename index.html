<!DOCTYPE html>
<html lang="zh-HK">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>OPS Apps</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI",sans-serif;
    background:#f3f4f6;
}

header{
    text-align:center;
    padding:40px 20px;
}

header h1{
    font-size:42px;
    color:#2563eb;
}

.apps-grid{
    max-width:1100px;
    margin:auto;
    padding:20px;

    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(180px,1fr));

    gap:20px;
}

.card{
    background:white;

    min-height:180px;

    border-radius:18px;

    text-decoration:none;
    color:#333;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    transition:0.25s;

    box-shadow:
    0 4px 12px rgba(0,0,0,.08);
}

.card:hover{

    background:#2563eb;
    color:white;

    transform:
    translateY(-6px);

    box-shadow:
    0 15px 30px rgba(37,99,235,.30);
}

.icon{

    font-size:58px;
    margin-bottom:15px;

    transition:.25s;
}

.card:hover .icon{
    transform:scale(1.15);
}

.card-title{
    font-size:18px;
    font-weight:600;
}

footer{
    text-align:center;
    padding:30px;
    color:#888;
}

</style>

</head>

<body>

<header>
    <h1>🚀 OPS Apps</h1>
</header>

<div class="apps-grid">

    Volume_Tools/
        <div class="icon">📊</div>
        <div class="card-title">Volume</div>
    </a>

    Ezycargo_Tools/
        <div class="icon">🧮</div>
        <div class="card-title">EzyCargo</div>
    </a>

    Undertaking_Tools_V5/
        <div class="icon">📦</div>
        <div class="card-title">Undertaking</div>
    </a>

    PDF_Tools/
        <div class="icon">📄</div>
        <div class="card-title">PDF Tools</div>
    </a>

    <a class="card" href="Excel_Batch_    <div class="icon">📁</div>
        <div class="card-title">Excel ZIP</div>
    </a>

    <a class="card" href="Order_Assignmentass="icon">🤖</div>
        <div class="card-title">Assignment</div>
    </a>

</div>

<footer>
    OPS Internal Tools
</footer>

</body>
</html>
