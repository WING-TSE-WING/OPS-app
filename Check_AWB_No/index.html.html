<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>AWB 擷取工具（拖曳＋去重）</title>

<!-- ✅ JSZip 正確載入（關鍵） -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body {
    font-family: Arial;
    padding: 20px;
}

#dropZone {
    border: 3px dashed #999;
    padding: 40px;
    text-align: center;
    color: #666;
    margin-bottom: 20px;
    transition: 0.2s;
}

#dropZone.dragover {
    border-color: #0078D7;
    background: #eef6ff;
    color: #0078D7;
}

textarea {
    width: 100%;
    height: 300px;
}

button {
    margin-top: 10px;
    padding: 8px 16px;
}
</style>
</head>

<body>

<h2>Word AWB 擷取工具（拖檔／選檔・自動去重）</h2>

<div id="dropZone">
    📂 把 Word (.docx) 拖到這裡<br>
    或<br><br>
    <input type="file" accept=".docx" id="fileInput">
</div>

<textarea id="output" placeholder="AWB 結果會顯示在這裡（已自動去重）"></textarea>

<br>
<button onclick="copyAll()">📋 一鍵 COPY</button>

<script>
const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");

dropZone.addEventListener("dragover", e => {
    e.preventDefault();
    dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => {
    dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener("change", e => {
    handleFile(e.target.files[0]);
});

async function handleFile(file) {
    if (!file || !file.name.endsWith(".docx")) {
        alert("請選擇 Word (.docx) 檔案");
        return;
    }

    const zip = await JSZip.loadAsync(file);
    const xml = await zip.file("word/document.xml").async("string");

    // 轉成純文字
    const text = xml.replace(/<[^>]+>/g, "");

    const regex = /Air Waybill No\.:\s*([0-9]{3}-[0-9]{8})/g;

    const awbSet = new Set();
    let match;

    while ((match = regex.exec(text)) !== null) {
        awbSet.add(match[1]);
    }

    const result = Array.from(awbSet);

    document.getElementById("output").value =
        result.length ? result.join("\n") : "⚠️ 找不到 Air Waybill No.";
}

function copyAll() {
    const textarea = document.getElementById("output");
    textarea.select();
    document.execCommand("copy");
    alert("✅ 已複製（重複 AWB 已移除）");
}
</script>

</body>
</html>
